# Builds the air/OS packages (x86_64 with HaikuPorts' Qt, gRPC and protobuf;
# arm64 with tools/haiku/build-gui-deps.sh's) on every push to master and
# publishes them to the rolling "latest" release, with links in the README.
# The pipeline itself lives in jmgasper/airos-ci.
name: air/OS build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: proton_bridge
      repo-dir: proton-bridge
    permissions:
      contents: write
