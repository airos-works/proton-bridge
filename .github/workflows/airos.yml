# Builds the air/OS package (x86_64; the Qt, gRPC and protobuf dependency set
# exists only there) on every push to master and publishes it to the rolling
# "latest" release, with links in the README.
# The pipeline itself lives in jmgasper/airos-ci.
name: air/OS build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: proton_bridge
      repo-dir: proton-bridge
      architectures: x86_64
    permissions:
      contents: write
